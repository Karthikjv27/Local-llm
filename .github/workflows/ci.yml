name: CI

on:
  push:
  workflow_dispatch:

# A new push to the same branch replaces the run in flight: no point testing a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: locie
          POSTGRES_USER: locie
          POSTGRES_PASSWORD: locie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locie -d locie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/locie
      DB_USER: locie
      DB_PASSWORD: locie
      MAVEN_OPTS: -Xmx1024m

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify = compile, all tests (unit, architecture, Spring context) and the runnable jar.
      # Flyway creates the schema against the service container, so the context test is real.
      - name: Verify
        run: mvn -B -ntp verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # build runs `tsc -b` first, so a type error fails the job.
      - name: Build
        run: npm run build
