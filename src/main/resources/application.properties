spring.application.name=locie
spring.profiles.default=local

# --- Datasource (override via env vars or application-local.properties) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/locie}
spring.datasource.username=${DB_USER:locie}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / schema ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Ollama ---
locie.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
locie.ollama.timeout=5s

# --- Chat context ---
# tokens the prompt budget targets; raise it only if the model was started with a larger num_ctx
locie.chat.context-tokens=${CHAT_CONTEXT_TOKENS:4096}
# hard cap on messages considered, regardless of how small they are
locie.chat.history-limit=${CHAT_HISTORY_LIMIT:40}

# --- Local retrieval (RAG) ---
# the embedding model must be installed in Ollama: ollama pull nomic-embed-text
locie.rag.embedding-model=${RAG_EMBEDDING_MODEL:nomic-embed-text}
locie.rag.chunk-size=${RAG_CHUNK_SIZE:1200}
locie.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:200}
# passages added to a prompt, and how close they must score to be added at all
locie.rag.top-k=${RAG_TOP_K:5}
locie.rag.min-score=${RAG_MIN_SCORE:0.30}
# indexing limits, so pointing it at a huge folder fails fast instead of embedding for an hour
locie.rag.max-file-bytes=${RAG_MAX_FILE_BYTES:1048576}
locie.rag.max-files=${RAG_MAX_FILES:2000}
# optional golden set for GET /api/rag/eval, one "question<TAB>expected path" line per case
locie.rag.eval-fixture=${RAG_EVAL_FIXTURE:}
